<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/books">Shelf</a>
      <nav aria-label="Main">
        <a href="#/books" data-route="books">Books</a>
        <a href="#/members" data-route="members">Members</a>
        <a href="#/loans" data-route="loans">Loans</a>
        <a href="#/reports" data-route="reports">Reports</a>
      </nav>
    </div>
  </header>
  <main id="app" class="page"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="page">Shelf needs JavaScript. The JSON API is still available, see the README.</p></noscript>
</body>
</html>
